name: Android build

on:
  push:
    branches: [ main, android-app-mvp, unified-valvoja, tarkastus, cloud-backup-drive, auth-registration ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Prepare persistent Cloud signing key
        env:
          CLOUD_KEYSTORE_BASE64: ${{ secrets.CLOUD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$CLOUD_KEYSTORE_BASE64" ]; then
            echo "CLOUD_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          mkdir -p signing
          echo "$CLOUD_KEYSTORE_BASE64" | base64 --decode > signing/cloud-keystore.jks
          test -s signing/cloud-keystore.jks
      - name: Build debug APK
        env:
          CLOUD_KEYSTORE_PASSWORD: ${{ secrets.CLOUD_KEYSTORE_PASSWORD }}
          CLOUD_KEY_ALIAS: ${{ secrets.CLOUD_KEY_ALIAS }}
        run: |
          if [ -z "$CLOUD_KEYSTORE_PASSWORD" ] || [ -z "$CLOUD_KEY_ALIAS" ]; then
            echo "Cloud signing secrets are missing"
            exit 1
          fi
          export CLOUD_KEYSTORE_PATH=../signing/cloud-keystore.jks
          gradle assembleDebug
      - name: Verify APK signature
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK location was not found"
            exit 1
          fi
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner was not found in $SDK_ROOT/build-tools"
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk 'app/build/outputs/apk/debug/tarkastus cloud.apk'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tarkastus-cloud
          path: app/build/outputs/apk/debug/tarkastus cloud.apk
