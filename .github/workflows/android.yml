name: Android build

on:
  push:
    branches: [ main, android-app-mvp, tarkastuspoytakirja-app ]
  pull_request:
    branches: [ main, android-app-mvp ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        run: gradle assembleDebug :tarkastus:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: valvoja-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Tarkastuspöytäkirja APK
        uses: actions/upload-artifact@v4
        with:
          name: tarkastuspoytakirja-debug
          path: tarkastus/build/outputs/apk/debug/tarkastus-debug.apk
